name: update-data-beta
on: 
  workflow_dispatch:

jobs:
  update-data-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm install
      - run: node scripts/airtable-downloader.js
      - run: node scripts/generate-website-data-files.js
